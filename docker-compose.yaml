version: '3.8'

services:
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  mlflow:
    image: mlflow:latest  # Используем собственный образ
    container_name: mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_TRACKING_URI: "http://0.0.0.0:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    entrypoint: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--gunicorn-opts", "--timeout 120"]

  experiment_runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: experiment_runner
    depends_on:
      - minio
      - mlflow
    environment:
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      S3_ENDPOINT_URL: "http://minio:9000"
    volumes:
      - ./data:/app/data
    entrypoint: ["python", "run_experiments.py", "--config", "/app/config.json", "--dataset_path", "/app/data/Titanic-Dataset.csv", "--s3_bucket", "models-bucket", "--experiment_name", "RandomForestExperiment", "--aws_access_key", "minioadmin", "--aws_secret_key", "minioadmin", "--endpoint_url", "http://minio:9000"]
volumes:
  minio_data: